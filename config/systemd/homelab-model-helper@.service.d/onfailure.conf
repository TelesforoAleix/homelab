# Phase 12 -- alert the owner if a model-helper connection fails.
#
# Installed to /etc/systemd/system/homelab-model-helper@.service.d/onfailure.conf
#
# A drop-in, not an edit to homelab-model-helper@.service itself -- mirrors
# homelab-telegram-bot.service.d/onfailure.conf's reasoning exactly. ADR-025
# governs the base unit; this adds behaviour without touching that text.
#
# This unit is itself templated (Accept=yes; one instance per connection), so
# its own %i is a per-connection instance name, not something worth paging on
# individually, and not a safe thing to interpolate into another unit's name
# without systemd-escape (Phase 18.1 defect 4's exact mistake). The literal
# alias "model-helper" is used instead: a fixed instance of
# homelab-notify@.service that pulls context from every
# homelab-model-helper@*.service instance via a journalctl glob, not from
# whichever one instance happened to fail.
[Unit]
OnFailure=homelab-notify@model-helper.service

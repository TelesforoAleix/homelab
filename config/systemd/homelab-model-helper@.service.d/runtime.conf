# Phase 23.0 -- take the RuntimeMaxSec debt Phase 15.0 recorded.
#
# Installed to /etc/systemd/system/homelab-model-helper@.service.d/runtime.conf
#
# WHY RuntimeMaxSec=270 (brief §6.9; 15.0 handover, the RuntimeMaxSec debt)
#
#   The base unit says RuntimeMaxSec=180 with the Phase 09 reasoning "a model
#   call that has not answered in two minutes is not going to". Phase 15.0
#   made the route a LIST: the helper tries the first provider with
#   timeout_seconds (120) and, on a timeout or an exhausted subscription,
#   falls back to the second with the same 120. Two providers x 120 s = 240 s
#   of legitimate work that the 180 s ceiling would kill in the middle of the
#   second call -- systemd's SIGTERM, and a `homelab-notify@model-helper`
#   alert for a request that was about to succeed. 270 is 2 x 120 plus 30 s
#   for process start, config load and the cap reservation; anything longer
#   than that IS a hang.
#
#   The endpoint's own client timeout to the helper is 280 s
#   (services/homelab-harness/config.example.json, helper_timeout_seconds) --
#   deliberately ABOVE this value, so the harness outlives the helper and
#   reports the helper's failure (helper_unavailable: "closed the connection
#   without a reply") rather than timing out first and blaming itself.
#
#   A drop-in, not an edit to the base unit, so ADR-025's file keeps its text
#   and this reasoning travels with the one line it excuses. Proved with the
#   15.0 fixture (unchanged behaviour), not with a real double timeout.
#   `systemctl show -p RuntimeMaxUSec homelab-model-helper@probe.service`
#   -> 4min 30s.
[Service]
RuntimeMaxSec=270

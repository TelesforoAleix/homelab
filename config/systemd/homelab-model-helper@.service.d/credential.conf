# Phase 15.1 -- the first credential on this node that can spend money.
#
# Installed to /etc/systemd/system/homelab-model-helper@.service.d/credential.conf.
# A drop-in keeps the Phase 09 base unit and every existing # WHY intact.
#
# WHY LoadCredential: the root-owned source is 0600 and systemd presents a
# 0400 copy owned by this one service instance under $CREDENTIALS_DIRECTORY.
# It is never an Environment= value (visible through /proc, systemctl show,
# children and crash reports), a command-line argument, or script stdin.
# GatewayProvider opens $CREDENTIALS_DIRECTORY/gateway-key and has no fallback.
#
# Not LoadCredentialEncrypted= by decision in brief §6.7: the key is revocable
# in minutes, while TPM sealing would add a failure mode to the utility route.
# Revoke at Vercel dashboard -> AI Gateway -> API keys -> homelab.
[Service]
LoadCredential=gateway-key:/etc/homelab-model-helper/gateway-key

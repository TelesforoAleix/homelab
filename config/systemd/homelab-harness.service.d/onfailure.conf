# Phase 23.0 -- alert the owner if the harness dies.
#
# Installed to /etc/systemd/system/homelab-harness.service.d/onfailure.conf
#
# A drop-in, not a line in homelab-harness.service itself, for the reason the
# bot's and the Workbench's drop-ins give: the unit file is the security-
# boundary document, and the alert wiring is behaviour added beside it,
# trivially removable.
#
# What fires it: a crash, a config error at start (harness.py exits 1 with the
# reason in the journal), or the start limit (5 in 300 s) -- once per
# transition into failed, as Phase 12 observed. A refused request is NOT a
# failure and does not fire this; refusals are the endpoint working.
#
# The alias is the literal string "harness", never %n or %N -- systemd
# escapes "-" as \x2d in specifier expansions (Phase 18.1 defect 4), and
# homelab-notify.sh maps this literal alias to the real unit name. The
# `harness)` case was added to that script in the same commit as this file
# (18.2 handover item 4: an alias missing there dies at the notifier with
# "unknown alert alias", exactly when the alert is wanted).
[Unit]
OnFailure=homelab-notify@harness.service

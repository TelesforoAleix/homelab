# Phase 18.2 -- alert the owner if the Workbench dies.
#
# Installed to /etc/systemd/system/homelab-workbench.service.d/onfailure.conf
#
# A drop-in, not a line in homelab-workbench.service itself, for the reason
# the bot's drop-in gives: the unit file is the security-boundary document,
# and the alert wiring is behaviour added beside it, trivially removable.
#
# A locked-volume skip is NOT a failure and does not fire this: the
# Condition leaves the unit inactive, never failed (the standard, §2). What
# fires it is a crash, an exit 2 from `refused: ...` at start (an
# uninitialised project, for instance), or the start limit -- once per
# transition into failed, as Phase 12 observed.
#
# The alias is the literal string "workbench", never %n or %N -- systemd
# escapes "-" as \x2d in specifier expansions (Phase 18.1 defect 4), and
# homelab-notify@.service maps this literal alias to the real unit name.
[Unit]
OnFailure=homelab-notify@workbench.service
